<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dock Shadow -->
    <filter id="dockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000000" flood-opacity="0.36" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.22" />
    </filter>

    <!-- Caustic Blur -->
    <filter id="causticBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>

    <!-- Liquid Glass Base Plate Gradient -->
    <linearGradient id="liquidGlassBase" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48" />
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.38" />
    </linearGradient>

    <!-- Rim Specular Gradient -->
    <linearGradient id="rimSpecular" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.75" />
    </linearGradient>

    <!-- Liquid Lens Highlight (Top Arc) -->
    <linearGradient id="liquidLensHighlight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass Shelf Material -->
    <linearGradient id="glassShelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f0f9ff" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#bae6fd" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Caustic Light Under Shelf -->
    <radialGradient id="causticBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </radialGradient>

    <!-- Book Materials (Translucent Colored Acrylic) -->
    <!-- 1. Sapphire Glass (Manga Volume) -->
    <linearGradient id="acrylicSapphire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.95" />
    </linearGradient>

    <!-- 2. Amber Liquid Sun (Comic Volume) -->
    <linearGradient id="acrylicAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.95" />
    </linearGradient>

    <!-- 3. Emerald Crystal (Archive Volume) -->
    <linearGradient id="acrylicEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#059669" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.95" />
    </linearGradient>

    <!-- 4. Frosted Ice Archivist Binder (Zip / Raw Archive) -->
    <linearGradient id="acrylicFrostedIce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#f1f5f9" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#cbd5e1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.85" />
    </linearGradient>

    <!-- 5. Dark Obsidian Binder -->
    <linearGradient id="acrylicObsidian" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- 6 & 7. Leaning Amethyst & Neon Cyan -->
    <linearGradient id="acrylicAmethyst" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#c084fc" stop-opacity="0.82" />
      <stop offset="80%" stop-color="#9333ea" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="acrylicCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.9" />
    </linearGradient>

    <!-- Sparkle Shape -->
    <path id="sparkle" d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#ffffff" />
  </defs>

  <!-- Base Dock Drop Shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#000000" filter="url(#dockShadow)" />

  <!-- Main Glass Container with Clipping -->
  <g clip-path="url(#squircleClip)">
    <!-- Frosted Translucent Glass Base -->
    <rect x="100" y="100" width="824" height="824" fill="url(#liquidGlassBase)" />

    <!-- Ambient Caustic Pool (Bottom Reflection) -->
    <ellipse cx="680" cy="790" rx="340" ry="180" fill="url(#causticBeam)" filter="url(#causticBlur)" />
    <circle cx="280" cy="240" r="280" fill="#38bdf8" fill-opacity="0.12" filter="url(#causticBlur)" />

    <!-- Glass Refraction Texture Lines -->
    <path d="M 120 400 Q 300 350 512 430 T 904 410" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" fill="none" />
    <path d="M 110 520 Q 350 480 600 550 T 914 530" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.12" fill="none" />

    <!-- CAUSTIC GLOW UNDER SHELF -->
    <ellipse cx="512" cy="695" rx="330" ry="24" fill="url(#causticBeam)" filter="url(#causticBlur)" />

    <!-- INVERTED REFLECTION ON GLASS FLOOR -->
    <g opacity="0.22" transform="translate(0, 1334) scale(1, -1)">
      <rect x="236" y="660" width="74" height="120" rx="6" fill="url(#acrylicSapphire)" />
      <rect x="320" y="660" width="68" height="120" rx="6" fill="url(#acrylicAmber)" />
      <rect x="398" y="660" width="72" height="120" rx="6" fill="url(#acrylicEmerald)" />
      <rect x="480" y="660" width="94" height="120" rx="6" fill="url(#acrylicFrostedIce)" />
      <rect x="584" y="660" width="86" height="120" rx="6" fill="url(#acrylicObsidian)" />
    </g>

    <!-- FLOATING CRYSTAL BOOKS & BINDERS -->
    <!-- Book 1: Sapphire Glass (Manga Volume) -->
    <g>
      <rect x="236" y="320" width="74" height="340" rx="8" fill="url(#acrylicSapphire)" />
      <!-- Spine Specular Highlight -->
      <rect x="240" y="322" width="6" height="336" rx="3" fill="#ffffff" fill-opacity="0.7" />
      <rect x="250" y="322" width="2" height="336" fill="#ffffff" fill-opacity="0.2" />
      <!-- Laser Spine Text -->
      <text x="274" y="520" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="800" letter-spacing="6" transform="rotate(-90 274 520)" fill-opacity="0.9">SHELFROW</text>
      <!-- Manga volume accent lines -->
      <rect x="242" y="340" width="62" height="3" fill="#ffffff" fill-opacity="0.6" />
      <rect x="242" y="348" width="62" height="3" fill="#ffffff" fill-opacity="0.6" />
      <polygon points="273,620 277,629 287,629 279,635 282,644 273,638 264,644 267,635 259,629 269,629" fill="#ffffff" fill-opacity="0.8" />
    </g>

    <!-- Book 2: Amber Liquid Sun (Comic Volume) -->
    <g>
      <rect x="320" y="275" width="68" height="385" rx="8" fill="url(#acrylicAmber)" />
      <rect x="324" y="277" width="5" height="381" rx="2.5" fill="#ffffff" fill-opacity="0.75" />
      <text x="355" y="490" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="800" letter-spacing="5" transform="rotate(-90 355 490)" fill-opacity="0.92">COMICS</text>
      <circle cx="354" cy="315" r="14" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
      <polygon points="354,308 357,314 364,314 358,318 360,324 354,320 348,324 350,318 344,314 351,314" fill="#ffffff" fill-opacity="0.9" />
    </g>

    <!-- Book 3: Emerald Crystal (Archive Volume) -->
    <g>
      <rect x="398" y="335" width="72" height="325" rx="8" fill="url(#acrylicEmerald)" />
      <rect x="402" y="337" width="5" height="321" rx="2.5" fill="#ffffff" fill-opacity="0.7" />
      <text x="435" y="525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" letter-spacing="4" transform="rotate(-90 435 525)" fill-opacity="0.88">SERIES</text>
      <!-- Minimalist stripes -->
      <rect x="408" y="370" width="52" height="36" rx="4" fill="#ffffff" fill-opacity="0.2" />
      <text x="434" y="394" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill-opacity="0.95">01</text>
    </g>

    <!-- Book 4: Frosted Ice Archivist Binder (Zip / Raw Box) -->
    <g>
      <rect x="480" y="295" width="94" height="365" rx="8" fill="url(#acrylicFrostedIce)" />
      <rect x="484" y="297" width="6" height="361" rx="3" fill="#ffffff" fill-opacity="0.85" />
      <!-- Binder Ring Cutout -->
      <circle cx="527" cy="590" r="16" fill="#0f172a" fill-opacity="0.25" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8" />
      <!-- Glass Label Pocket -->
      <rect x="502" y="345" width="50" height="140" rx="4" fill="#ffffff" fill-opacity="0.4" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />
      <text x="528" y="425" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="800" letter-spacing="3" transform="rotate(-90 528 425)" fill-opacity="0.75">ARCHIVE</text>
    </g>

    <!-- Book 5: Smoky Obsidian Binder -->
    <g>
      <rect x="584" y="310" width="86" height="350" rx="8" fill="url(#acrylicObsidian)" />
      <rect x="588" y="312" width="6" height="346" rx="3" fill="#ffffff" fill-opacity="0.65" />
      <circle cx="627" cy="590" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#ffffff" stroke-width="3" stroke-opacity="0.75" />
      <rect x="604" y="355" width="46" height="130" rx="4" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="628" y="430" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700" letter-spacing="3" transform="rotate(-90 628 430)" fill-opacity="0.85">FILES</text>
    </g>

    <!-- Books 6 & 7: Leaning Crystal Folios (Artbooks / Doujinshi) -->
    <g transform="translate(670, 310) rotate(11)">
      <!-- Book 6: Violet Amethyst -->
      <rect x="0" y="0" width="52" height="345" rx="7" fill="url(#acrylicAmethyst)" />
      <rect x="3" y="2" width="4" height="341" rx="2" fill="#ffffff" fill-opacity="0.75" />
      <!-- Book 7: Electric Cyan (Overlapping translucent) -->
      <rect x="42" y="10" width="34" height="335" rx="6" fill="url(#acrylicCyan)" />
      <rect x="44" y="12" width="3" height="331" rx="1.5" fill="#ffffff" fill-opacity="0.85" />
    </g>

    <!-- SOLID POLISHED GLASS SHELF -->
    <g>
      <!-- Glass Slab Body -->
      <rect x="180" y="660" width="664" height="36" rx="10" fill="url(#glassShelfGrad)" />
      <!-- Polished Front Bevel Edge (Prismatic Top Line) -->
      <line x1="184" y1="661" x2="840" y2="661" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="184" y1="695" x2="840" y2="695" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Internal Crystal Specular -->
      <line x1="200" y1="676" x2="824" y2="676" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
    </g>

    <!-- TOP LIQUID SPECULAR ARC (Refractive Dome Highlight) -->
    <path d="M 100 270 C 100 140 180 100 512 100 C 730 100 870 140 924 240 C 760 330 280 370 100 270 Z" fill="url(#liquidLensHighlight)" />

    <!-- HIGH-PRECISION RIM BORDER (Specular Rim Light) -->
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" ry="183.5" fill="none" stroke="url(#rimSpecular)" stroke-width="3" />

    <!-- PRISMATIC LENS GLINTS (Optical Sparkles) -->
    <use href="#sparkle" x="210" y="150" transform="scale(1.2)" />
    <use href="#sparkle" x="836" y="662" transform="scale(0.9)" />
    <use href="#sparkle" x="484" y="297" transform="scale(0.75)" />
  </g>
</svg>
